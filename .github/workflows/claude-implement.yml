# Setzt ein Issue um und öffnet einen Pull Request.
# Start: Label "claude:auto" (durch dich) ODER automatisch aus claude-plan.yml / claude-unlock.yml.
# Ergebnis als Label: claude:pr-open | needs-human (+ Grund) | claude:failed
name: Claude – Issue umsetzen

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue-Nummer"
        required: true
        type: number

concurrency:
  group: claude-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude:auto'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Optional: eigene Toolchain installieren (GitHub-Runner haben Node, Python, Java, Go usw. bereits).
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      - name: Status → in Arbeit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --add-label "claude:in-progress" || true
          gh issue edit "$ISSUE" --remove-label "claude:auto,claude:failed,needs-human" || true

      - name: Claude setzt um
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # Claude-Abo (Pro/Max)
          # Damit automatisch gestartete Läufe (workflow_dispatch) nicht als "Bot" abgelehnt werden:
          allowed_bots: "github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ env.ISSUE }}

            Setze GitHub Issue #${{ env.ISSUE }} selbstständig um. Halte dich an CLAUDE.md.

            1. Lies das Issue inkl. Kommentaren: `gh issue view ${{ env.ISSUE }} --comments`
               (Antworten von Menschen auf frühere Rückfragen stehen in den Kommentaren.)
            2. Prüfe VOR jeder Codeänderung, ob ein Mensch gebraucht wird:
               decision (Kriterien unklar, offene Entscheidung), access (Secrets/Zugänge),
               external (Dritte/Recht), risky (Breaking Change, Datenmigration, Security/Auth,
               Änderungen an .github/workflows/), manual-test (nur manuell prüfbar).
               Falls ja: ändere keinen Code, poste mit `gh issue comment` konkrete, nummerierte
               Fragen bzw. was ein Mensch tun muss, und gib status=needs_human zurück.
            3. Sonst:
               - `git checkout -B claude/issue-${{ env.ISSUE }}`
               - Implementiere sauber und minimal, inkl. Tests für die Akzeptanzkriterien.
               - Führe Tests/Linter aus (Befehle stehen in CLAUDE.md) und behebe Fehler.
                 Scheitern Tests nach mehreren Versuchen weiter: status=failed mit Begründung.
               - Commit mit klarer Message, dann `git push -u origin HEAD --force-with-lease`
               - `gh pr create --title "<prägnanter Titel>" --body "<Was/Warum, wie getestet, Closes #${{ env.ISSUE }}>"`
                 (existiert schon ein PR für den Branch, genügt der Push)
               - status=pr_created und pr_url zurückgeben.
            4. Merge niemals und ändere keine Labels – das erledigt der Workflow.
          # Bash-Freigaben: auf deinen Tech-Stack kürzen (je weniger, desto sicherer).
          claude_args: |
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(mvn:*),Bash(./gradlew:*),Bash(dotnet:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["pr_created","needs_human","failed"]},"pr_url":{"type":"string"},"human_category":{"type":"string","enum":["decision","access","external","risky","manual-test","none"]},"reason":{"type":"string"}},"required":["status","reason"]}'

      - name: Ergebnis per Label melden
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$RESULT" ] && RESULT='{}'
          STATUS=$(jq -r '.status // "failed"' <<<"$RESULT")
          CAT=$(jq -r '.human_category // "none"' <<<"$RESULT")
          REASON=$(jq -r '.reason // "Kein Ergebnis (Abbruch, Timeout oder Fehler)."' <<<"$RESULT")

          gh issue edit "$ISSUE" --remove-label "claude:in-progress" || true
          case "$STATUS" in
            pr_created)
              gh issue edit "$ISSUE" --add-label "claude:pr-open" ;;
            needs_human)
              LABELS="needs-human"
              [ "$CAT" != "none" ] && LABELS="$LABELS,needs-human:$CAT"
              gh issue edit "$ISSUE" --add-label "$LABELS" ;;
            *)
              gh issue edit "$ISSUE" --add-label "needs-human,claude:failed"
              gh issue comment "$ISSUE" --body "⚠️ Automatische Umsetzung nicht abgeschlossen: ${REASON}

          Details: ${RUN_URL}
          Zum Neustart: Label \`claude:auto\` setzen." ;;
          esac
