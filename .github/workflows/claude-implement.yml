# IMPLEMENT (Sonnet): Issue umsetzen und Pull Request öffnen.
# Start: Label "claude:auto-implement" – durch dich, oder automatisch durch claude-architect.yml.
# Vorab-Prüfung: Hat das Issue offene "Depends on #…", wird es auf claude:queued gesetzt
# und Claude NICHT gestartet. Der unlock-Job in claude-architect.yml startet es später.
# Ergebnis als Label: claude:pr-open | needs-human | claude:failed | claude:queued
name: Claude – Implement (Sonnet)

on:
  issues:
    # Ausüfhren bei Labelling von Issues
    types: [labeled]
  
  workflow_dispatch: # Workflow darf per Knopf oder Befehl gestartet werden
    inputs:          
      issue_number:  # … und nimmt dabei Eingaben entgegen:
        description: "Issue-Nummer" # Beschriftung des Feldes in der GitHub-Oberfläche
        required: true              # Pflichtfeld – ohne Nummer kein Start
        type: number                # Nur Zahlen erlaubt

concurrency:
  group: claude-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    # Manueller Start oder claude:auto-implement-Label wurde vergeben
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude:auto-implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Optional: Toolchain installieren (Node, Python, Java, Go usw. sind auf GitHub-Runnern schon da).
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      # ─────────────────────────────────────────────────────────────────
      # ABHÄNGIGKEITEN PRÜFEN (bevor Claude startet)
      # Egal wer das Label gesetzt hat (Chat, Mensch, Architect): Ein Issue mit
      # offenen Vorgängern darf noch nicht umgesetzt werden.
      #
      # Ablauf:
      #  1. Issue-Text lesen, alle Zeilen "Depends on #<Nummer>" suchen.
      #  2. Jeden Vorgänger prüfen. Offen oder nicht lesbar → blockiert.
      #  3. Blockiert → Labels claude:auto-implement/in-progress entfernen,
      #     claude:queued setzen, Ausgabe blocked=true. Alle weiteren Schritte
      #     werden übersprungen (kein Claude-Aufruf, kein Kontingent).
      #     Der unlock-Job startet das Issue, sobald alle Vorgänger geschlossen sind.
      #  4. Nicht blockiert → blocked=false, normal weiter.
      # ─────────────────────────────────────────────────────────────────
      - name: Abhängigkeiten prüfen
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(gh issue view "$ISSUE" --json body --jq .body)
          deps=$(grep -oiE 'depends on #[0-9]+' <<<"$body" | grep -oE '[0-9]+' | sort -u || true)
          open=""
          for d in $deps; do
            state=$(gh issue view "$d" --json state --jq .state 2>/dev/null || echo OPEN)
            [ "$state" != "CLOSED" ] && open="$open #$d"
          done
          if [ -n "$open" ]; then
            echo "Offene Abhängigkeiten:$open → warten"
            gh issue edit "$ISSUE" --remove-label "claude:auto-implement,claude:in-progress" || true
            gh issue edit "$ISSUE" --add-label "claude:queued" || true
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Status → in Arbeit
        if: steps.deps.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --add-label "claude:in-progress" || true
          gh issue edit "$ISSUE" --remove-label "claude:failed,needs-human,claude:queued" || true

      # Umsetzung des Issues mittels Claude Sonnet. Rückgabe eines JSON zum Status der Umsetzung
      - name: Claude setzt um
        id: claude
        if: steps.deps.outputs.blocked != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]" # nötig für den automatischen Start durch architect
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ env.ISSUE }}

            Setze GitHub Issue #${{ env.ISSUE }} um. Halte dich an CLAUDE.md und an die
            Vorgaben im Issue (Dateien, Schnittstellen, Akzeptanzkriterien).

            1. Lies das Issue inkl. Kommentaren: `gh issue view ${{ env.ISSUE }} --comments`
               Steht dort „Teil von #N“, lies auch #N für den Gesamtkontext.
            2. Brauchst du einen Menschen (Vorgaben unklar oder widersprüchlich, Secrets/Zugänge
               nötig, riskante Änderung wie Datenmigration, Auth/Security, .github/workflows/)?
               Dann ändere keinen Code, poste konkrete, nummerierte Fragen mit `gh issue comment`
               und gib status=needs_human zurück.
            3. Sonst:
               - Branch vorbereiten: `git fetch origin`. Prüfe mit
                 `git ls-remote --heads origin claude/issue-${{ env.ISSUE }}`, ob der Branch schon existiert.
                 * Existiert er (z. B. Neustart, oder ein offener PR mit Korrekturen per @claude):
                   `git checkout -B claude/issue-${{ env.ISSUE }} origin/claude/issue-${{ env.ISSUE }}`
                   und darauf weiterarbeiten. Bestehende Commits NICHT verwerfen. Ist der Branch
                   veraltet, `git merge origin/${{ github.event.repository.default_branch }}` und
                   Konflikte sauber lösen.
                 * Existiert er nicht: `git checkout -b claude/issue-${{ env.ISSUE }} origin/${{ github.event.repository.default_branch }}`
               - Umsetzen, inkl. Tests für die Akzeptanzkriterien. Nur das ändern, was das Issue verlangt.
               - Tests/Linter laufen lassen (Befehle in CLAUDE.md) und Fehler beheben.
                 Scheitert es nach mehreren Versuchen: status=failed mit Begründung.
               - Commit, dann `git push -u origin HEAD` (kein Force-Push – so bleiben frühere
                 Commits und Korrekturen erhalten).
               - Prüfe mit `gh pr list --head claude/issue-${{ env.ISSUE }} --state open`, ob schon ein PR existiert.
                 Wenn nein: `gh pr create --title "<Titel>" --body "<Was, warum, wie getestet. Closes #${{ env.ISSUE }}>"`
                 Wenn ja: der Push genügt.
               - status=pr_created und pr_url zurückgeben.
            4. Niemals mergen, keine Labels ändern.
          # Bash-Freigaben auf deinen Tech-Stack kürzen (je weniger, desto sicherer).
          claude_args: |
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(mvn:*),Bash(./gradlew:*),Bash(dotnet:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["pr_created","needs_human","failed"]},"pr_url":{"type":"string"},"reason":{"type":"string"}},"required":["status","reason"]}'

      # Ergebnis des Claude Calls wird per Skript gesetzt
      # Entfernt die Labels claude:in-progress & claude:auto-implement und setzt je nach status das Label claude:pr-open, needs-human oder als Standard needs-human und claude:failed
      # always(): läuft auch bei Zeitlimit/Abbruch, damit kein Issue auf claude:in-progress hängen bleibt.
      # Übersprungen nur, wenn das Issue wegen offener Abhängigkeiten auf claude:queued gesetzt wurde.
      - name: Ergebnis per Label melden
        if: always() && steps.deps.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$RESULT" ] && RESULT='{}'
          STATUS=$(jq -r '.status // "failed"' <<<"$RESULT")
          REASON=$(jq -r '.reason // "Kein Ergebnis (Abbruch, Timeout oder Fehler)."' <<<"$RESULT")
          gh issue edit "$ISSUE" --remove-label "claude:in-progress,claude:auto-implement" || true
          case "$STATUS" in
            pr_created)  gh issue edit "$ISSUE" --add-label "claude:pr-open" ;;
            needs_human) gh issue edit "$ISSUE" --add-label "needs-human" ;;
            *)           gh issue edit "$ISSUE" --add-label "needs-human,claude:failed"
                         gh issue comment "$ISSUE" --body "⚠️ Umsetzung nicht abgeschlossen: ${REASON}

          Details: ${RUN_URL}
          Neustart: Label \`claude:auto-implement\` erneut setzen." ;;
          esac
