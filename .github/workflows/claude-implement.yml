# IMPLEMENT (Sonnet): Issue umsetzen und Pull Request öffnen.
# Start: Label "claude:auto-implement" – durch dich, oder automatisch durch claude-architect.yml.
# Ergebnis als Label: claude:pr-open | needs-human | claude:failed
name: Claude – Implement (Sonnet)

on:
  issues:
    types: [labeled]
  workflow_dispatch: # wird von claude-architect.yml genutzt
    inputs:
      issue_number:
        description: "Issue-Nummer"
        required: true
        type: number

concurrency:
  group: claude-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude:auto-implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Optional: Toolchain installieren (Node, Python, Java, Go usw. sind auf GitHub-Runnern schon da).
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      - name: Status → in Arbeit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE" --add-label "claude:in-progress" || true
          gh issue edit "$ISSUE" --remove-label "claude:failed,needs-human,claude:queued" || true

      - name: Claude setzt um
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]" # nötig für den automatischen Start durch architect
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ env.ISSUE }}

            Setze GitHub Issue #${{ env.ISSUE }} um. Halte dich an CLAUDE.md und an die
            Vorgaben im Issue (Dateien, Schnittstellen, Akzeptanzkriterien).

            1. Lies das Issue inkl. Kommentaren: `gh issue view ${{ env.ISSUE }} --comments`
               Steht dort „Teil von #N“, lies auch #N für den Gesamtkontext.
            2. Brauchst du einen Menschen (Vorgaben unklar oder widersprüchlich, Secrets/Zugänge
               nötig, riskante Änderung wie Datenmigration, Auth/Security, .github/workflows/)?
               Dann ändere keinen Code, poste konkrete, nummerierte Fragen mit `gh issue comment`
               und gib status=needs_human zurück.
            3. Sonst:
               - `git checkout -B claude/issue-${{ env.ISSUE }}`
               - Umsetzen, inkl. Tests für die Akzeptanzkriterien. Nur das ändern, was das Issue verlangt.
               - Tests/Linter laufen lassen (Befehle in CLAUDE.md) und Fehler beheben.
                 Scheitert es nach mehreren Versuchen: status=failed mit Begründung.
               - Commit, dann `git push -u origin HEAD --force-with-lease`
               - `gh pr create --title "<Titel>" --body "<Was, warum, wie getestet. Closes #${{ env.ISSUE }}>"`
                 (gibt es schon einen PR für den Branch, reicht der Push)
               - status=pr_created und pr_url zurückgeben.
            4. Niemals mergen, keine Labels ändern.
          # Bash-Freigaben auf deinen Tech-Stack kürzen (je weniger, desto sicherer).
          claude_args: |
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(make:*),Bash(go:*),Bash(cargo:*),Bash(mvn:*),Bash(./gradlew:*),Bash(dotnet:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["pr_created","needs_human","failed"]},"pr_url":{"type":"string"},"reason":{"type":"string"}},"required":["status","reason"]}'

      - name: Ergebnis per Label melden
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$RESULT" ] && RESULT='{}'
          STATUS=$(jq -r '.status // "failed"' <<<"$RESULT")
          REASON=$(jq -r '.reason // "Kein Ergebnis (Abbruch, Timeout oder Fehler)."' <<<"$RESULT")
          gh issue edit "$ISSUE" --remove-label "claude:in-progress,claude:auto-implement" || true
          case "$STATUS" in
            pr_created)  gh issue edit "$ISSUE" --add-label "claude:pr-open" ;;
            needs_human) gh issue edit "$ISSUE" --add-label "needs-human" ;;
            *)           gh issue edit "$ISSUE" --add-label "needs-human,claude:failed"
                         gh issue comment "$ISSUE" --body "⚠️ Umsetzung nicht abgeschlossen: ${REASON}

          Details: ${RUN_URL}
          Neustart: Label \`claude:auto-implement\` erneut setzen." ;;
          esac
