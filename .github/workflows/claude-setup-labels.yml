# Einmalig ausführen: Actions → "Claude – Labels anlegen" → Run workflow.
# Legt alle Steuer-Labels an (mehrfach ausführen schadet nicht).
name: Claude – Labels anlegen

on:
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          mk() { gh label create "$1" --color "$2" --description "$3" --force; }
          mk "anforderung"             "5319e7" "Neue Anforderung – Claude erstellt einen Plan"
          mk "plan:review"             "c5def5" "Plan liegt vor – bitte prüfen"
          mk "plan:approved"           "0e8a16" "Plan freigegeben – Claude legt Issues an"
          mk "plan:done"               "bfd4f2" "Issues wurden angelegt"
          mk "claude:auto"             "1f883d" "Claude setzt automatisch um"
          mk "claude:queued"           "bfdadc" "Wartet auf andere Issues (Depends on #…)"
          mk "claude:in-progress"      "fbca04" "Claude arbeitet gerade daran"
          mk "claude:pr-open"          "0e8a16" "Pull Request offen – bitte reviewen"
          mk "claude:failed"           "b60205" "Automatische Umsetzung fehlgeschlagen"
          mk "needs-human"             "d93f0b" "Ein Mensch muss etwas tun oder entscheiden"
          mk "needs-human:decision"    "f9d0c4" "Offene Entscheidung (Produkt/UX/Architektur)"
          mk "needs-human:access"      "f9d0c4" "Zugänge, Secrets oder Infrastruktur nötig"
          mk "needs-human:external"    "f9d0c4" "Abstimmung mit Dritten oder rechtliche Frage"
          mk "needs-human:risky"       "f9d0c4" "Riskante Änderung – Mensch soll entscheiden"
          mk "needs-human:manual-test" "f9d0c4" "Nur manuell prüfbar"
