# Einmalig ausführen: Actions → "Claude – Labels anlegen" → Run workflow.
# Legt alle Labels an. Mehrfach ausführen schadet nicht.
name: Claude – Labels anlegen

on:
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          mk() { gh label create "$1" --color "$2" --description "$3" --force; }
          # Start-Labels (setzt du)
          mk "claude:auto-implement" "1f883d" "Sonnet setzt dieses Issue um und öffnet einen PR"
          mk "claude:auto-architect" "5319e7" "Opus zerlegt die Aufgabe in Implement-Issues"
          # Status-Labels (setzt der Workflow)
          mk "claude:queued"         "bfdadc" "Wartet auf andere Issues (Depends on #…)"
          mk "claude:in-progress"    "fbca04" "Claude arbeitet gerade daran"
          mk "claude:architected"    "c5def5" "Architektur fertig – Implement-Issues angelegt"
          mk "claude:pr-open"        "0e8a16" "Pull Request offen – bitte reviewen"
          mk "claude:failed"         "b60205" "Automatischer Lauf fehlgeschlagen"
          mk "needs-human"           "d93f0b" "Ein Mensch muss etwas klären oder tun"
